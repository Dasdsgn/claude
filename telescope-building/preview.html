<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BUILDING Fonts</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./preview.css" />
  </head>

  <body class="loading">
    <main>
      <div class="wrapper">
        <div class="content">
          <div class="section">
            <h1 aria-label="BUILDING">
              <span class="left" aria-hidden="true">BUILD</span>
              <span class="right" aria-hidden="true">ING</span>
            </h1>

            <div class="section__media">
              <div class="section__media__back">
                <img src="./img/img-big.webp" alt="" />
              </div>

              <div class="section__media__front front-1"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-2"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-3"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-4"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-5"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-6"><img src="./img/img-big.webp" alt="" /></div>
            </div>

            <div class="section__images">
              <img src="./img/img-1.webp" alt="" />
              <img src="./img/img-2.webp" alt="" />
              <img src="./img/img-3.webp" alt="" />
              <img src="./img/img-4.webp" alt="" />
              <img src="./img/img-5.webp" alt="" />
              <img src="./img/img-6.webp" alt="" />
              <img src="./img/img-7.webp" alt="" />
              <img src="./img/img-8.webp" alt="" />
              <img src="./img/img-9.webp" alt="" />
              <img src="./img/img-10.webp" alt="" />
            </div>
          </div>
        </div>
      </div>
    </main>


    <div class="picker" id="picker" role="group" aria-label="Font and colour options"></div>
    <script>
      const OPTIONS = [
        { n: "A  Archivo wide · graphite", c: "#1a1a1a", ff: '"Archivo", sans-serif', fw: 600, fst: "125%", fs: "2.6vw" },
        { n: "B  Archivo wide · orange", c: "#d9480f", ff: '"Archivo", sans-serif', fw: 600, fst: "125%", fs: "2.6vw" },
        { n: "C  Inter Tight · graphite", c: "#1a1a1a", ff: '"Inter Tight", sans-serif', fw: 500, fst: "100%", fs: "3.2vw" },
        { n: "D  Bebas Neue · rust", c: "#b8441f", ff: '"Bebas Neue", sans-serif', fw: 400, fst: "100%", fs: "5vw" },
        { n: "E  Instrument Serif · graphite", c: "#1a1a1a", ff: '"Instrument Serif", serif', fw: 400, fst: "100%", fs: "4.6vw" }
      ];
      const root = document.documentElement;
      const picker = document.getElementById("picker");
      const apply = (i) => {
        const o = OPTIONS[i];
        root.style.setProperty("--color-text", o.c);
        root.style.setProperty("--ff", o.ff);
        root.style.setProperty("--fw", o.fw);
        root.style.setProperty("--fst", o.fst);
        root.style.setProperty("--fs", o.fs);
        picker.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", j === i));
        try { history.replaceState(null, "", "#" + "abcde"[i]); } catch (e) {}
      };
      OPTIONS.forEach((o, i) => {
        const b = document.createElement("button");
        b.innerHTML = '<i style="background:' + o.c + '"></i>' + o.n;
        b.addEventListener("click", () => apply(i));
        picker.appendChild(b);
      });
      apply(Math.max(0, "abcde".indexOf((location.hash || "#a")[1])));
    </script>

    <script src="./vendor/gsap.min.js"></script>
    <script src="./vendor/ScrollTrigger.min.js"></script>
    <script src="./vendor/ScrollSmoother.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
