<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BUILDING Colours</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./preview.css" />
  </head>

  <body class="loading">
    <main>
      <div class="wrapper">
        <div class="content">
          <div class="section">
            <h1 aria-label="BUILDING">
              <span class="left" aria-hidden="true">BUILDING</span>
              <span class="right" aria-hidden="true">BUILDING</span>
            </h1>

            <div class="section__media">
              <div class="section__media__back">
                <img src="./img/img-big.webp" alt="" />
              </div>

              <div class="section__media__front front-1"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-2"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-3"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-4"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-5"><img src="./img/img-big.webp" alt="" /></div>
              <div class="section__media__front front-6"><img src="./img/img-big.webp" alt="" /></div>
            </div>

            <div class="section__images">
              <img src="./img/img-1.webp" alt="" />
              <img src="./img/img-2.webp" alt="" />
              <img src="./img/img-3.webp" alt="" />
              <img src="./img/img-4.webp" alt="" />
              <img src="./img/img-5.webp" alt="" />
              <img src="./img/img-6.webp" alt="" />
              <img src="./img/img-7.webp" alt="" />
              <img src="./img/img-8.webp" alt="" />
              <img src="./img/img-9.webp" alt="" />
              <img src="./img/img-10.webp" alt="" />
            </div>
          </div>
        </div>
      </div>
    </main>


    <div class="picker" id="picker" role="group" aria-label="Colour options"></div>
    <script>
      const THEMES = [
        { g: "Light", n: "1 Red on bone", bg: "#f3efe8", fg: "#ad0003" },
        { g: "Light", n: "2 Graphite on concrete", bg: "#dad8d3", fg: "#1a1a1a" },
        { g: "Light", n: "3 Brick on sand", bg: "#eadfd0", fg: "#7a1f12" },
        { g: "Light", n: "4 Navy on fog", bg: "#e6eaec", fg: "#0f2a43" },
        { g: "Dark", n: "5 Bone on black", bg: "#0e0e0e", fg: "#f2ede4" },
        { g: "Dark", n: "6 Cream on oxblood", bg: "#2a0a0b", fg: "#f4e9dd" },
        { g: "Dark", n: "7 Ice on navy", bg: "#0b1621", fg: "#e8eef2" },
        { g: "Dark", n: "8 Red on black", bg: "#0e0e0e", fg: "#ff2b2e" },
        { g: "Dark", n: "9 Yellow on asphalt", bg: "#16191c", fg: "#ffc400" }
      ];
      const root = document.documentElement;
      const picker = document.getElementById("picker");
      const apply = (i) => {
        root.style.setProperty("--color-bg", THEMES[i].bg);
        root.style.setProperty("--color-text", THEMES[i].fg);
        picker.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.i == i));
        try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
      };
      ["Light", "Dark"].forEach((g) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<span class="label">' + g + "</span>";
        THEMES.forEach((t, i) => {
          if (t.g !== g) return;
          const b = document.createElement("button");
          b.dataset.i = i;
          b.innerHTML = '<span class="sw" style="background:' + t.bg + ";color:" + t.fg + '">Aa</span>' + t.n;
          b.addEventListener("click", () => apply(i));
          row.appendChild(b);
        });
        picker.appendChild(row);
      });
      apply(Math.max(0, Math.min(THEMES.length - 1, (parseInt((location.hash || "#1").slice(1), 10) || 1) - 1)));
    </script>

    <script src="./vendor/gsap.min.js"></script>
    <script src="./vendor/ScrollTrigger.min.js"></script>
    <script src="./vendor/ScrollSmoother.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
